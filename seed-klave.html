<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seed KLAVE — Northhh Labs</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{background:#0b0d10;color:#e7e9ec;font-family:'JetBrains Mono',monospace;padding:32px 18px;}
  h1{font-family:'Big Shoulders Display',sans-serif;font-size:28px;margin-bottom:20px;}
  input{width:100%;background:#12151a;border:1px solid #23272e;color:#e7e9ec;padding:10px;margin-bottom:12px;border-radius:4px;font-family:inherit;}
  button{background:#5eead4;color:#0b0d10;border:none;padding:12px 20px;border-radius:4px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;}
  #msg{margin-top:16px;font-size:13px;white-space:pre-wrap;}
  #loginBox{display:block;}
  #seedBox{display:none;}
</style>
</head>
<body>
<h1>Seed KLAVE case study</h1>

<div id="loginBox">
  <input type="email" id="email" placeholder="Admin email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Sign in</button>
</div>

<div id="seedBox">
  <p>Signed in. This will overwrite the "klave" project document with the full case study content.</p>
  <button id="seedBtn">Write KLAVE case study to Firestore</button>
</div>

<div id="msg"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDsaQB7wR0IpKfzbyX2ygNiaC2DPEWX_cg",
    authDomain: "northhh-dev-72fad.firebaseapp.com",
    projectId: "northhh-dev-72fad",
    storageBucket: "northhh-dev-72fad.firebasestorage.app",
    messagingSenderId: "37733150896",
    appId: "1:37733150896:web:44bf542ff4b31f60914b75"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const el = id => document.getElementById(id);

  const KLAVE_DATA = {
    title: "KLAVE",
    problem: "The beat marketplace space is getting flooded with AI-generated music, and producers had no fair, human-verified marketplace to sell beats or prove their work is real.",
    whatBuilt: "An AI-powered beat marketplace with an integrated AI assistant (NERO) powered by Claude, tiered producer payouts, a stem-verification flow to prove beats are human-made, and a full producer/buyer experience — built and maintained solo.",
    stack: ["Vercel", "Firebase Auth", "Firestore", "Cloudinary", "Claude API"],
    decisions: [
      "Used Firebase Auth + Firestore instead of a custom backend, to move fast as a solo builder",
      "Chose Cloudinary over Firebase Storage to avoid upfront hosting costs",
      "Gated NERO behind a \"coming soon\" message rather than shipping it broken, since the Claude API isn't funded yet",
      "Positioned the product around \"100% human-made beats\" with a stem-upload verification flow, to differentiate from AI-flooded competitors"
    ],
    challenges: [
      "Building a full-stack marketplace entirely from a phone, with no laptop or desktop at any stage",
      "Enforcing free-tier limits (upload caps, no exclusive pricing, watermarked previews) without a dedicated backend",
      "Client-side-only admin checks and an exposed Cloudinary preset flagged as security gaps to fix before launch"
    ],
    screenshots: [],
    liveUrl: "https://klaveapp.vercel.app",
    githubUrl: "https://github.com/beatsbynorth21/KLAVE",
    published: true
  };

  onAuthStateChanged(auth, (user) => {
    if(user){
      el('loginBox').style.display = 'none';
      el('seedBox').style.display = 'block';
    }
  });

  el('loginBtn').onclick = async () => {
    try{
      await signInWithEmailAndPassword(auth, el('email').value.trim(), el('password').value);
    }catch(err){
      el('msg').textContent = 'Login failed: ' + err.message;
    }
  };

  el('seedBtn').onclick = async () => {
    el('msg').textContent = 'Writing...';
    try{
      await setDoc(doc(db, 'projects', 'klave'), KLAVE_DATA);
      el('msg').textContent = 'Done. The klave document has been fully updated.';
    }catch(err){
      el('msg').textContent = 'Failed: ' + err.message;
    }
  };
</script>
</body>
</html>
